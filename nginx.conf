# /etc/nginx/sites-available/malikk.xyz
server {
    listen 80;
    listen [::]:80;
    server_name malikk.xyz www.malikk.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name malikk.xyz www.malikk.xyz;

    ssl_certificate     /etc/letsencrypt/live/malikk.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malikk.xyz/privkey.pem;

    root /var/www/malikk.xyz;
    index index.html;

    # security headers
    add_header X-Frame-Options              "SAMEORIGIN"          always;
    add_header X-Content-Type-Options       "nosniff"             always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;

    # gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # hashed build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
